plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'zeeko.org.royal2026'
    compileSdk 35

    defaultConfig {
        applicationId "zeeko.org.royal2026"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ==========================================
    // 1. مكتبات تطبيقك الأساسية
    // ==========================================
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.core:core-ktx:1.13.1'

    // ==========================================
    // 2. تحليلات فايربيس (فقط Analytics كما طلبت)
    // ==========================================
    implementation platform('com.google.firebase:firebase-bom:34.14.0') 
    implementation 'com.google.firebase:firebase-analytics'

    // ==========================================
    // 3. إعلانات Unity Ads
    // ==========================================
    implementation 'com.unity3d.ads:unity-ads:4.12.3'

    // ==========================================
    // 4. مكتبة Glide لعرض الصور (أساسية ومهمة للتصميم)
    // ==========================================
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
